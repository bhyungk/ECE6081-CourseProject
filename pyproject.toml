[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wesad-starter"
version = "0.1.0"
description = "WESAD classroom baseline: wrist EDA/BVP, participant LOSO, and reproducible reports"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
wesad-starter = "wesad_starter.cli:main"

[tool.setuptools.packages.find]
include = ["wesad_starter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
